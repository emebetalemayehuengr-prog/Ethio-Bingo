name: Deploy Frontend to cPanel (Fallback)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend-cpanel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_BASE: ${{ secrets.VITE_API_BASE || 'https://api.40bingo.com' }}
      RUNTIME_API_BASE: ${{ secrets.RUNTIME_API_BASE || secrets.VITE_API_BASE || 'https://api.40bingo.com' }}
      SITE_URL: ${{ secrets.SITE_URL || 'https://40bingo.com' }}
      CPANEL_HOST: ${{ secrets.CPANEL_HOST || secrets.SSH_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER || secrets.SSH_USER }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || secrets.SSH_PORT || '22' }}
      CPANEL_FRONTEND_STAGING_PATH: ${{ format('/home/{0}/.gha-frontend-staging-{1}', secrets.CPANEL_USER || secrets.SSH_USER, github.run_id) }}
      CPANEL_FRONTEND_PATH: ${{ secrets.CPANEL_FRONTEND_PATH || secrets.SSH_FRONTEND_PATH || '~/public_html' }}
      CPANEL_FTP_FRONTEND_PATH: ${{ secrets.CPANEL_FTP_FRONTEND_PATH || '/public_html' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.CPANEL_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
      CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Override runtime API base
        shell: bash
        run: |
          set -euo pipefail
          printf 'window.__RUNTIME_CONFIG__ = { API_BASE: "%s" };\n' "$RUNTIME_API_BASE" > frontend/dist/runtime-config.js

      - name: Stamp deploy revision
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > frontend/dist/.deploy-revision

      - name: Package frontend build for transfer
        shell: bash
        run: |
          set -euo pipefail
          tar -C frontend/dist -czf frontend-dist.tgz .

      - name: Validate deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -z "${CPANEL_HOST:-}" ] && missing+=("CPANEL_HOST/SSH_HOST")
          [ -z "${CPANEL_USER:-}" ] && missing+=("CPANEL_USER/SSH_USER")
          if [ -z "${DEPLOY_SSH_KEY:-}" ] && [ -z "${CPANEL_PASSWORD:-}" ]; then
            missing+=("DEPLOY_SSH_KEY|CPANEL_SSH_KEY|SSH_PRIVATE_KEY|SSH_KEY or CPANEL_PASSWORD")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing deploy credentials: ${missing[*]}"
            exit 1
          fi

      - name: Upload frontend via SSH/SCP
        if: ${{ env.DEPLOY_SSH_KEY != '' }}
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.CPANEL_HOST }}
          username: ${{ env.CPANEL_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.CPANEL_PORT }}
          source: "frontend-dist.tgz"
          target: ${{ env.CPANEL_FRONTEND_STAGING_PATH }}
          overwrite: true
          timeout: 5m
          command_timeout: 15m

      - name: Promote frontend staging build to active cPanel docroots
        if: ${{ env.DEPLOY_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.CPANEL_HOST }}
          username: ${{ env.CPANEL_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.CPANEL_PORT }}
          timeout: 5m
          command_timeout: 2m
          script: |
            set -euo pipefail
            STAGING="${{ env.CPANEL_FRONTEND_STAGING_PATH }}"
            PRIMARY="${{ env.CPANEL_FRONTEND_PATH }}"
            WANT="${{ github.sha }}"
            SITE_URL="${{ env.SITE_URL }}"
            HOME_DIR="$(cd ~ && pwd)"
            SITE_HOST="$(printf '%s' "$SITE_URL" | sed -E 's#^https?://##; s#/.*$##')"
            SITE_HOST="${SITE_HOST#www.}"

            STAGING_TGZ="$STAGING/frontend-dist.tgz"
            STAGING_SRC="$STAGING"

            if [ ! -d "$STAGING" ]; then
              echo "Frontend staging path not found: $STAGING"
              exit 1
            fi

            if [ -f "$STAGING_TGZ" ]; then
              rm -rf "$STAGING/current"
              mkdir -p "$STAGING/current"
              tar -xzf "$STAGING_TGZ" -C "$STAGING/current"
              STAGING_SRC="$STAGING/current"
            fi

            if [ ! -f "$STAGING_SRC/index.html" ]; then
              echo "Frontend staging source missing index.html at: $STAGING_SRC"
              exit 1
            fi

            deploy_target() {
              target="$1"
              allow_any="$2"
              target="${target%/}"
              [ -z "$target" ] && return 0
              if [ "$allow_any" != "yes" ]; then
                case "$target" in
                  "$HOME_DIR"/*) ;;
                  *) return 0 ;;
                esac
              fi
              [ -d "$target" ] || return 0
              if printf '%s\n' "$DEPLOYED" | grep -Fx -- "$target" >/dev/null 2>&1; then
                return 0
              fi

              echo "sync_frontend_to $target"
              if command -v rsync >/dev/null 2>&1; then
                rsync -a --delete --exclude '.well-known' "$STAGING_SRC"/ "$target"/
              else
                cp -a "$STAGING_SRC"/. "$target"/
              fi
              printf '%s\n' "$WANT" > "$target/.deploy-revision"
              DEPLOYED="$(printf '%s\n%s\n' "$DEPLOYED" "$target" | sed '/^$/d')"
            }

            DEPLOYED=""
            deploy_target "$PRIMARY" yes
            deploy_target "$HOME_DIR/public_html" no
            deploy_target "$HOME_DIR/public_html/$SITE_HOST" no
            deploy_target "$HOME_DIR/public_html/www.$SITE_HOST" no
            deploy_target "$HOME_DIR/$SITE_HOST" no
            deploy_target "$HOME_DIR/www/$SITE_HOST" no

            LIVE_BASE="${SITE_URL%/}"
            LIVE_REV_BEFORE="$(curl --fail --show-error --silent --max-time 12 "$LIVE_BASE/.deploy-revision" || true)"
            if [ -n "$LIVE_REV_BEFORE" ]; then
              for revfile in $(find "$HOME_DIR" -maxdepth 8 -type f -name '.deploy-revision' 2>/dev/null); do
                got="$(tr -d '\n' < "$revfile" 2>/dev/null || true)"
                [ "$got" = "$LIVE_REV_BEFORE" ] || continue
                deploy_target "$(dirname "$revfile")" no
              done
            fi

            LIVE_INDEX_JS="$(curl --fail --show-error --silent --max-time 12 "$LIVE_BASE/index.html" 2>/dev/null | tr -d '\r' | grep -oE 'assets/index-[^"[:space:]]+\.js' | head -n1 || true)"
            if [ -n "$LIVE_INDEX_JS" ]; then
              for idx in $(find "$HOME_DIR" -maxdepth 8 -type f -name 'index.html' 2>/dev/null); do
                if grep -Fq "$LIVE_INDEX_JS" "$idx" 2>/dev/null; then
                  deploy_target "$(dirname "$idx")" no
                fi
              done
            fi

            if [ -z "$DEPLOYED" ]; then
              echo "No deployable frontend docroot candidates found."
              exit 1
            fi

            for cache_root in "$HOME_DIR/lscache" "$HOME_DIR/tmp/lscache" "$HOME_DIR/public_html/lscache"; do
              if [ -d "$cache_root" ]; then
                find "$cache_root" -mindepth 1 -maxdepth 6 -exec rm -rf {} + 2>/dev/null || true
                echo "purged_cache_root $cache_root"
              fi
            done

            echo "frontend_docroots_synced:"
            printf '%s\n' "$DEPLOYED" | sed '/^$/d'

      - name: Upload frontend via FTPS
        if: ${{ env.DEPLOY_SSH_KEY == '' && env.CPANEL_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y lftp

          lftp -u "${CPANEL_USER}","${CPANEL_PASSWORD}" "${CPANEL_HOST}" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          mirror -R --delete --verbose frontend/dist "${CPANEL_FTP_FRONTEND_PATH}"
          bye
          LFTP

      - name: Verify frontend revision
        shell: bash
        run: |
          set -euo pipefail
          SITE="${SITE_URL%/}"
          WANT="${GITHUB_SHA}"
          REV=""
          for i in 1 2 3 4 5; do
            REV=$(curl -fsS --max-time 12 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "${SITE}/.deploy-revision?cb=${GITHUB_RUN_ID}-${i}" 2>/dev/null || true)
            if [ "$REV" = "$WANT" ]; then
              echo "frontend_revision_ok $REV"
              exit 0
            fi
            echo "Attempt ${i}: got '${REV}', waiting..."
            sleep 4
          done
          echo "::error::Frontend deploy revision mismatch. Expected ${WANT}, got '${REV}'"
          exit 1

