name: Deploy Frontend to cPanel (Fallback)

on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend-cpanel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_BASE: ${{ secrets.VITE_API_BASE || 'https://api.40bingo.com' }}
      RUNTIME_API_BASE: ${{ secrets.RUNTIME_API_BASE || secrets.VITE_API_BASE || 'https://api.40bingo.com' }}
      SITE_URL: ${{ secrets.SITE_URL || 'https://www.40bingo.com' }}
      CPANEL_HOST: ${{ secrets.CPANEL_HOST || secrets.SSH_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER || secrets.SSH_USER }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || secrets.SSH_PORT || '22' }}
      CPANEL_SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE || secrets.SSH_PASSPHRASE }}
      EXPECTED_CPANEL_USER: ${{ secrets.EXPECTED_CPANEL_USER || 'bingoco1' }}
      CPANEL_HOME: ${{ format('/home/{0}', secrets.CPANEL_USER || secrets.SSH_USER || 'bingoco1') }}
      CPANEL_FRONTEND_PATH: ${{ format('/home/{0}/public_html', secrets.EXPECTED_CPANEL_USER || secrets.CPANEL_USER || secrets.SSH_USER || 'bingoco1') }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.CPANEL_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
      FRONTEND_ARCHIVE: frontend-${{ github.sha }}.tgz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Override runtime API base
        shell: bash
        run: |
          set -euo pipefail
          printf 'window.__RUNTIME_CONFIG__ = { API_BASE: "%s" };\n' "$RUNTIME_API_BASE" > frontend/dist/runtime-config.js

      - name: Detect expected frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_JS="$(grep -oE 'assets/index-[^"]+\.js' frontend/dist/index.html | head -n1 || true)"
          if [ -z "$EXPECTED_JS" ]; then
            echo "::error::Could not detect expected frontend JS bundle from dist/index.html"
            exit 1
          fi
          echo "EXPECTED_FRONTEND_JS=$EXPECTED_JS" >> "$GITHUB_ENV"

      - name: Stamp deploy revision
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > frontend/dist/.deploy-revision
          printf '%s\n' "${GITHUB_SHA}" > frontend/dist/deploy-revision.txt

      - name: Package frontend build
        shell: bash
        run: |
          set -euo pipefail
          tar -C frontend/dist -czf "${FRONTEND_ARCHIVE}" .

      - name: Validate deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -z "${CPANEL_HOST:-}" ] && missing+=("CPANEL_HOST/SSH_HOST")
          [ -z "${CPANEL_USER:-}" ] && missing+=("CPANEL_USER/SSH_USER")
          [ -z "${DEPLOY_SSH_KEY:-}" ] && missing+=("DEPLOY_SSH_KEY|CPANEL_SSH_KEY|SSH_PRIVATE_KEY|SSH_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing deploy credentials: ${missing[*]}"
            exit 1
          fi

      - name: Upload frontend package via SSH/SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.CPANEL_HOST }}
          username: ${{ env.CPANEL_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          passphrase: ${{ env.CPANEL_SSH_PASSPHRASE }}
          port: ${{ env.CPANEL_PORT }}
          source: ${{ env.FRONTEND_ARCHIVE }}
          target: ${{ env.CPANEL_HOME }}
          overwrite: true
          timeout: 5m
          command_timeout: 15m

      - name: Deploy frontend package to docroot
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.CPANEL_HOST }}
          username: ${{ env.CPANEL_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          passphrase: ${{ env.CPANEL_SSH_PASSPHRASE }}
          port: ${{ env.CPANEL_PORT }}
          timeout: 5m
          command_timeout: 2m
          script: |
            set -euo pipefail
            HOME_DIR="$(cd ~ && pwd)"
            DOCROOT="${{ env.CPANEL_FRONTEND_PATH }}"
            ARCHIVE="$HOME_DIR/${{ env.FRONTEND_ARCHIVE }}"
            WANT="${{ github.sha }}"

            if [ "$(whoami)" != "${{ env.EXPECTED_CPANEL_USER }}" ]; then
              echo "Wrong cPanel account. Expected '${{ env.EXPECTED_CPANEL_USER }}' but got '$(whoami)'."
              exit 1
            fi

            if [ ! -f "$ARCHIVE" ]; then
              ARCHIVE="$(find "$HOME_DIR" -maxdepth 6 -type f -name "${{ env.FRONTEND_ARCHIVE }}" 2>/dev/null | head -n1 || true)"
            fi
            if [ ! -f "$ARCHIVE" ]; then
              echo "frontend archive not found: $ARCHIVE"
              exit 1
            fi

            mkdir -p "$DOCROOT"
            echo "deploy_docroot=$DOCROOT"
            echo "deploy_archive=$ARCHIVE"
            find "$DOCROOT" -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf {} + 2>/dev/null || true
            tar -xzf "$ARCHIVE" -C "$DOCROOT"
            printf '%s\n' "$WANT" > "$DOCROOT/.deploy-revision"
            printf '%s\n' "$WANT" > "$DOCROOT/deploy-revision.txt"
            test -f "$DOCROOT/index.html"
            echo "server_bundle=$(grep -oE 'assets/index-[^\"[:space:]]+\\.js' "$DOCROOT/index.html" | head -n1 || true)"
            echo "server_revision=$(tr -d '\n' < "$DOCROOT/deploy-revision.txt")"

            for cache_root in "$HOME_DIR/lscache" "$HOME_DIR/tmp/lscache" "$DOCROOT/lscache"; do
              if [ -d "$cache_root" ]; then
                find "$cache_root" -mindepth 1 -maxdepth 6 -exec rm -rf {} + 2>/dev/null || true
              fi
            done

      - name: Verify frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          SITE="${SITE_URL%/}"
          WANT_BUNDLE="${EXPECTED_FRONTEND_JS}"
          LIVE_BUNDLE=""
          for i in 1 2 3 4 5; do
            LIVE_INDEX="$(curl --fail --show-error --silent --max-time 15 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$SITE/index.html?cb=${GITHUB_RUN_ID}-${i}" || true)"
            LIVE_BUNDLE="$(printf '%s' "$LIVE_INDEX" | grep -oE 'assets/index-[^"[:space:]]+\.js' | head -n1 || true)"
            if [ "$LIVE_BUNDLE" = "$WANT_BUNDLE" ]; then
              echo "frontend_bundle_ok $LIVE_BUNDLE"
              exit 0
            fi
            echo "Attempt ${i}: got '${LIVE_BUNDLE}', expected '${WANT_BUNDLE}'"
            sleep 4
          done
          echo "::error::Frontend deploy verification failed. Expected bundle '${WANT_BUNDLE}', got '${LIVE_BUNDLE}'"
          exit 1
