name: Deploy to HahuCloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hahucloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_BASE: ${{ secrets.VITE_API_BASE || 'https://api.40bingo.com' }}
      RUNTIME_API_BASE: ${{ secrets.RUNTIME_API_BASE || secrets.VITE_API_BASE || 'https://api.40bingo.com' }}
      SITE_URL: ${{ secrets.SITE_URL || 'https://www.40bingo.com' }}
      SSH_HOST: ${{ secrets.SSH_HOST || secrets.CPANEL_HOST }}
      SSH_USER: ${{ secrets.SSH_USER || secrets.CPANEL_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.DEPLOY_SSH_KEY }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE || secrets.CPANEL_SSH_PASSPHRASE }}
      SSH_PORT: ${{ secrets.SSH_PORT || secrets.CPANEL_PORT || '22' }}
      EXPECTED_CPANEL_USER: ${{ secrets.EXPECTED_CPANEL_USER || 'bingoco1' }}
      SSH_HOME: ${{ format('/home/{0}', secrets.SSH_USER || secrets.CPANEL_USER || 'bingoco1') }}
      SSH_FRONTEND_PATH: ${{ format('/home/{0}/public_html', secrets.EXPECTED_CPANEL_USER || secrets.SSH_USER || secrets.CPANEL_USER || 'bingoco1') }}
      SSH_BACKEND_PATH: ${{ secrets.CPANEL_BACKEND_PATH || secrets.SSH_BACKEND_PATH || format('/home/{0}/apps/40bingo-backend', secrets.SSH_USER || secrets.CPANEL_USER || 'bingoco1') }}
      FRONTEND_ARCHIVE: frontend-${{ github.sha }}.tgz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Override runtime API base
        shell: bash
        run: |
          set -euo pipefail
          printf 'window.__RUNTIME_CONFIG__ = { API_BASE: "%s" };\n' "$RUNTIME_API_BASE" > frontend/dist/runtime-config.js

      - name: Detect expected frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_JS="$(grep -oE 'assets/index-[^"]+\.js' frontend/dist/index.html | head -n1 || true)"
          if [ -z "$EXPECTED_JS" ]; then
            echo "::error::Could not detect expected frontend JS bundle from dist/index.html"
            exit 1
          fi
          echo "EXPECTED_FRONTEND_JS=$EXPECTED_JS" >> "$GITHUB_ENV"

      - name: Verify frontend build artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          test -f frontend/dist/.htaccess
          test -f frontend/dist/runtime-config.js
          test -n "${EXPECTED_FRONTEND_JS:-}"

      - name: Install backend deps
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Validate backend app import
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.main import app
          assert app is not None
          print("Backend import ok")
          PY

      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SSH_HOST SSH_USER SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required deploy secrets: ${missing[*]}"
            exit 1
          fi

      - name: SSH handshake to cPanel
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          timeout: 2m
          command_timeout: 1m
          script: |
            set -e
            echo "github_actions_ssh_ok user=$(whoami) host=$(hostname -f 2>/dev/null || hostname)"
            if [ "$(whoami)" != "${{ env.EXPECTED_CPANEL_USER }}" ]; then
              echo "Wrong cPanel account. Expected '${{ env.EXPECTED_CPANEL_USER }}' but got '$(whoami)'."
              exit 1
            fi

      - name: Pull cPanel git working trees (if present)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          timeout: 3m
          command_timeout: 2m
          script: |
            set -euo pipefail
            if [ "$(whoami)" != "${{ env.EXPECTED_CPANEL_USER }}" ]; then
              echo "Wrong cPanel account. Expected '${{ env.EXPECTED_CPANEL_USER }}' but got '$(whoami)'."
              exit 1
            fi
            if ! command -v git >/dev/null 2>&1; then
              echo "git binary not found on cPanel host; skipping server-side pull."
              exit 0
            fi
            for target in "${{ env.SSH_FRONTEND_PATH }}" "${{ env.SSH_BACKEND_PATH }}"; do
              if [ -d "$target/.git" ]; then
                echo "git_pull_target=$target"
                git -C "$target" pull --ff-only
              else
                echo "git_pull_skip_no_repo=$target"
              fi
            done

      - name: Sanitize backend tree for upload
        shell: bash
        run: |
          set -euo pipefail
          find backend -type d -name __pycache__ -print0 2>/dev/null | xargs -0r rm -rf
          find backend -type f -name '*.pyc' -delete 2>/dev/null || true
          rm -rf backend/.venv
          rm -f backend/.env backend/data/*.db 2>/dev/null || true

      - name: Stamp deploy revision on artifacts
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > frontend/dist/.deploy-revision
          printf '%s\n' "${GITHUB_SHA}" > frontend/dist/deploy-revision.txt
          printf '%s\n' "${GITHUB_SHA}" > backend/.deploy-revision
          printf '%s\n' "${GITHUB_SHA}" > backend/deploy-revision.txt

      - name: Package frontend build for transfer
        shell: bash
        run: |
          set -euo pipefail
          tar -C frontend/dist -czf "${FRONTEND_ARCHIVE}" .

      - name: Upload frontend package
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          source: ${{ env.FRONTEND_ARCHIVE }}
          target: ${{ env.SSH_HOME }}
          overwrite: true
          timeout: 5m
          command_timeout: 15m

      - name: Deploy frontend package to docroot
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          timeout: 5m
          command_timeout: 2m
          script: |
            set -euo pipefail
            DOCROOT="${{ env.SSH_FRONTEND_PATH }}"
            HOME_DIR="$(cd ~ && pwd)"
            ARCHIVE="$HOME_DIR/${{ env.FRONTEND_ARCHIVE }}"
            WANT="${{ github.sha }}"

            if [ "$(whoami)" != "${{ env.EXPECTED_CPANEL_USER }}" ]; then
              echo "Wrong cPanel account. Expected '${{ env.EXPECTED_CPANEL_USER }}' but got '$(whoami)'."
              exit 1
            fi

            if [ ! -f "$ARCHIVE" ]; then
              ARCHIVE="$(find "$HOME_DIR" -maxdepth 6 -type f -name "${{ env.FRONTEND_ARCHIVE }}" 2>/dev/null | head -n1 || true)"
            fi
            if [ ! -f "$ARCHIVE" ]; then
              echo "frontend archive not found: $ARCHIVE"
              exit 1
            fi

            mkdir -p "$DOCROOT"
            echo "deploy_docroot=$DOCROOT"
            echo "deploy_archive=$ARCHIVE"
            find "$DOCROOT" -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf {} + 2>/dev/null || true
            tar -xzf "$ARCHIVE" -C "$DOCROOT"
            printf '%s\n' "$WANT" > "$DOCROOT/.deploy-revision"
            printf '%s\n' "$WANT" > "$DOCROOT/deploy-revision.txt"
            test -f "$DOCROOT/index.html"
            echo "server_bundle=$(grep -oE 'assets/index-[^\"[:space:]]+\\.js' "$DOCROOT/index.html" | head -n1 || true)"
            echo "server_revision=$(tr -d '\n' < "$DOCROOT/deploy-revision.txt")"

            for cache_root in "$HOME_DIR/lscache" "$HOME_DIR/tmp/lscache" "$DOCROOT/lscache"; do
              if [ -d "$cache_root" ]; then
                find "$cache_root" -mindepth 1 -maxdepth 6 -exec rm -rf {} + 2>/dev/null || true
              fi
            done

      - name: Upload backend to HahuCloud
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          source: "backend/"
          target: ${{ env.SSH_BACKEND_PATH }}
          overwrite: true
          strip_components: 1
          timeout: 5m
          command_timeout: 15m

      - name: Verify deploy landed on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          timeout: 2m
          command_timeout: 1m
          script: |
            set -euo pipefail
            FE="${{ env.SSH_FRONTEND_PATH }}"
            BE="${{ env.SSH_BACKEND_PATH }}"
            WANT="${{ github.sha }}"
            test -f "$FE/deploy-revision.txt"
            test -f "$BE/.deploy-revision"
            test "$(tr -d '\n' < "$FE/deploy-revision.txt")" = "$WANT"
            test "$(tr -d '\n' < "$BE/.deploy-revision")" = "$WANT"
            test -f "$FE/index.html"
            echo "deploy_revision_ok $WANT"

      - name: Verify frontend bundle on origin host
        shell: bash
        run: |
          set -euo pipefail
          SITE="${SITE_URL%/}"
          SITE_HOST="$(printf '%s' "$SITE" | sed -E 's#^https?://##; s#/.*$##')"
          ORIGIN_HOST="${SSH_HOST}"
          ORIGIN_ADDR="$(getent ahostsv4 "$ORIGIN_HOST" | awk 'NR==1{print $1}' || true)"
          if [ -z "$ORIGIN_ADDR" ]; then
            ORIGIN_ADDR="$(getent hosts "$ORIGIN_HOST" | awk 'NR==1{print $1}' || true)"
          fi
          if [ -z "$ORIGIN_ADDR" ]; then
            echo "::error::Unable to resolve origin host address from SSH_HOST='$ORIGIN_HOST'"
            exit 1
          fi
          WANT_BUNDLE="${EXPECTED_FRONTEND_JS}"
          WANT_SHA="${GITHUB_SHA}"
          ATTEMPTS=20
          SLEEP_SECONDS=6
          for i in $(seq 1 "$ATTEMPTS"); do
            LIVE_INDEX="$(curl --fail --show-error --silent --max-time 15 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              --resolve "${SITE_HOST}:443:${ORIGIN_ADDR}" \
              "https://${SITE_HOST}/index.html?cb=${GITHUB_RUN_ID}-origin-${i}" || true)"
            LIVE_BUNDLE="$(printf '%s' "$LIVE_INDEX" | grep -oE 'assets/index-[^"[:space:]]+\.js' | head -n1 || true)"
            LIVE_REVISION="$(curl --fail --show-error --silent --max-time 15 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              --resolve "${SITE_HOST}:443:${ORIGIN_ADDR}" \
              "https://${SITE_HOST}/deploy-revision.txt?cb=${GITHUB_RUN_ID}-origin-${i}" | tr -d '\r\n' || true)"
            echo "origin attempt $i/$ATTEMPTS: live_bundle='$LIVE_BUNDLE' expected_bundle='$WANT_BUNDLE' live_revision='$LIVE_REVISION' expected_revision='$WANT_SHA' origin_addr='$ORIGIN_ADDR'"
            if [ "$LIVE_BUNDLE" = "$WANT_BUNDLE" ]; then
              echo "live_bundle_ok $LIVE_BUNDLE"
              exit 0
            fi
            if [ "$LIVE_REVISION" = "$WANT_SHA" ]; then
              echo "live_revision_ok $LIVE_REVISION"
              exit 0
            fi
            sleep "$SLEEP_SECONDS"
          done
          echo "::error::Origin host is still not serving the expected bundle or deploy revision."
          exit 1

      - name: Restart backend app (Passenger)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          timeout: 5m
          command_timeout: 2m
          script: |
            set -e
            BACKEND_PATH="${{ env.SSH_BACKEND_PATH }}"
            if [ ! -d "$BACKEND_PATH" ]; then
              echo "Backend path not found: $BACKEND_PATH"
              exit 1
            fi
            mkdir -p "$BACKEND_PATH/tmp"
            touch "$BACKEND_PATH/tmp/restart.txt"
            test -f "$BACKEND_PATH/passenger_wsgi.py"
            test -f "$BACKEND_PATH/app/main.py"

      - name: Verify backend health endpoint
        if: ${{ env.RUNTIME_API_BASE != '' || env.VITE_API_BASE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="${RUNTIME_API_BASE:-$VITE_API_BASE}"
          API_BASE="${API_BASE%/}"
          case "$API_BASE" in
            */api) HEALTH_URL="$API_BASE/health" ;;
            *) HEALTH_URL="$API_BASE/api/health" ;;
          esac
          curl --fail --show-error --silent --retry 5 --retry-delay 5 "$HEALTH_URL"

      - name: Verify frontend bundle is live on public domain (cache propagation monitor)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SITE="${SITE_URL%/}"
          WANT_BUNDLE="${EXPECTED_FRONTEND_JS}"
          WANT_SHA="${GITHUB_SHA}"
          ATTEMPTS=25
          SLEEP_SECONDS=8
          for i in $(seq 1 "$ATTEMPTS"); do
            LIVE_INDEX="$(curl --fail --show-error --silent --max-time 15 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$SITE/index.html?cb=${GITHUB_RUN_ID}-public-${i}" || true)"
            LIVE_BUNDLE="$(printf '%s' "$LIVE_INDEX" | grep -oE 'assets/index-[^"[:space:]]+\.js' | head -n1 || true)"
            LIVE_REVISION="$(curl --fail --show-error --silent --max-time 15 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$SITE/deploy-revision.txt?cb=${GITHUB_RUN_ID}-public-${i}" | tr -d '\r\n' || true)"
            echo "public attempt $i/$ATTEMPTS: live_bundle='$LIVE_BUNDLE' expected_bundle='$WANT_BUNDLE' live_revision='$LIVE_REVISION' expected_revision='$WANT_SHA'"
            if [ "$LIVE_BUNDLE" = "$WANT_BUNDLE" ] || [ "$LIVE_REVISION" = "$WANT_SHA" ]; then
              echo "public_domain_propagation_ok"
              exit 0
            fi
            sleep "$SLEEP_SECONDS"
          done
          echo "::warning::Public domain still appears cached/stale after deploy; origin is updated."
