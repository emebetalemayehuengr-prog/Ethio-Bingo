name: Deploy to HahuCloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hahucloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_BASE: ${{ secrets.VITE_API_BASE || 'https://api.40bingo.com' }}
      RUNTIME_API_BASE: ${{ secrets.RUNTIME_API_BASE || secrets.VITE_API_BASE || 'https://api.40bingo.com' }}
      SSH_HOST: ${{ secrets.SSH_HOST || secrets.CPANEL_HOST }}
      SSH_USER: ${{ secrets.SSH_USER || secrets.CPANEL_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.DEPLOY_SSH_KEY }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
      SSH_PORT: ${{ secrets.SSH_PORT || secrets.CPANEL_PORT || '22' }}
      SSH_FRONTEND_PATH: ${{ secrets.SSH_FRONTEND_PATH || secrets.CPANEL_FRONTEND_PATH || '~/public_html' }}
      SSH_BACKEND_PATH: ${{ secrets.SSH_BACKEND_PATH || secrets.CPANEL_BACKEND_PATH || '~/apps/40bingo-backend' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Override runtime API base (optional)
        if: ${{ env.RUNTIME_API_BASE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'window.__RUNTIME_CONFIG__ = { API_BASE: "%s" };\n' "$RUNTIME_API_BASE" > frontend/dist/runtime-config.js

      - name: Verify frontend build artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          test -f frontend/dist/.htaccess
          test -f frontend/dist/runtime-config.js

      - name: Install backend deps
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Validate backend app import
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.main import app
          assert app is not None
          print("Backend import ok")
          PY

      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SSH_HOST SSH_USER SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required deploy secrets: ${missing[*]}"
            exit 1
          fi

      - name: SSH handshake to cPanel (diagnostic)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          timeout: 2m
          command_timeout: 1m
          script: |
            set -e
            echo "github_actions_ssh_ok user=$(whoami) host=$(hostname -f 2>/dev/null || hostname)"

      - name: Sanitize backend tree for upload
        shell: bash
        run: |
          set -euo pipefail
          find backend -type d -name __pycache__ -print0 2>/dev/null | xargs -0r rm -rf
          find backend -type f -name '*.pyc' -delete 2>/dev/null || true
          rm -rf backend/.venv
          rm -f backend/.env backend/data/*.db 2>/dev/null || true

      - name: Stamp deploy revision on artifacts
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > frontend/dist/.deploy-revision
          printf '%s\n' "${GITHUB_SHA}" > backend/.deploy-revision

      - name: Upload frontend to HahuCloud (SCP recursive)
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          source: "frontend/dist/"
          target: ${{ env.SSH_FRONTEND_PATH }}
          strip_components: 2
          overwrite: true
          timeout: 5m
          command_timeout: 15m

      - name: Upload backend to HahuCloud (SCP recursive)
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          source: "backend/"
          target: ${{ env.SSH_BACKEND_PATH }}
          overwrite: true
          strip_components: 1
          timeout: 5m
          command_timeout: 15m

      - name: Verify deploy landed on server (revision files)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          timeout: 2m
          command_timeout: 1m
          script: |
            set -euo pipefail
            FE="${{ env.SSH_FRONTEND_PATH }}"
            BE="${{ env.SSH_BACKEND_PATH }}"
            WANT="${{ github.sha }}"
            test -f "$FE/.deploy-revision"
            test -f "$BE/.deploy-revision"
            test "$(tr -d '\n' < "$FE/.deploy-revision")" = "$WANT"
            test "$(tr -d '\n' < "$BE/.deploy-revision")" = "$WANT"
            echo "deploy_revision_ok $WANT"

      - name: Restart backend app (Passenger)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          timeout: 5m
          command_timeout: 2m
          script: |
            set -e
            BACKEND_PATH="${{ env.SSH_BACKEND_PATH }}"
            if [ ! -d "$BACKEND_PATH" ]; then
              echo "Backend path not found: $BACKEND_PATH"
              exit 1
            fi
            mkdir -p "$BACKEND_PATH/tmp"
            touch "$BACKEND_PATH/tmp/restart.txt"
            test -f "$BACKEND_PATH/passenger_wsgi.py"
            test -f "$BACKEND_PATH/app/main.py"

      - name: Verify backend health endpoint
        if: ${{ env.RUNTIME_API_BASE != '' || env.VITE_API_BASE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="${RUNTIME_API_BASE:-$VITE_API_BASE}"
          API_BASE="${API_BASE%/}"
          case "$API_BASE" in
            */api) HEALTH_URL="$API_BASE/health" ;;
            *) HEALTH_URL="$API_BASE/api/health" ;;
          esac
          curl --fail --show-error --silent --retry 5 --retry-delay 5 "$HEALTH_URL"
